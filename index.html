<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>campusPay</title>
    <style>
      :root {
        --bg: #f2f5f9;
        --ink: #14213d;
        --mut: #5d6b82;
        --card: #fff;
        --line: #d9e0ea;
        --ok: #0b8f7e;
        --bad: #c93c3c;
        --warn: #b7791f;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1626;
          --ink: #e8edf6;
          --mut: #93a1ba;
          --card: #18223a;
          --line: #2b3957;
          --ok: #35c4af;
          --bad: #ff7070;
          --warn: #f0b34a;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 "Avenir Next",
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 22px;
        border-bottom: 1px solid var(--line);
        background: var(--card);
      }
      .brand {
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.5px;
      }
      .brand i {
        font-style: normal;
        color: var(--ok);
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px;
        display: grid;
        grid-template-columns: 3fr 2fr;
        gap: 20px;
      }
      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 16px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 30px;
        letter-spacing: -1px;
      }
      .mut {
        color: var(--mut);
        font-size: 13px;
      }
      .big {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -1.5px;
      }
      button,
      input {
        font: inherit;
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
      }
      button {
        cursor: pointer;
        background: var(--ink);
        color: var(--bg);
        border: 0;
        font-weight: 600;
      }
      button.ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--ok);
        outline-offset: 2px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin: 6px 0;
      }
      .row input {
        width: 130px;
      }
      .bar {
        height: 8px;
        background: var(--line);
        border-radius: 4px;
        overflow: hidden;
        margin: 4px 0 10px;
      }
      .bar b {
        display: block;
        height: 100%;
        background: var(--ok);
      }
      .tag {
        padding: 2px 8px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 700;
      }
      .APPROVED,
      .open {
        background: #0b8f7e22;
        color: var(--ok);
      }
      .BLOCKED {
        background: #c93c3c22;
        color: var(--bad);
      }
      .done {
        background: var(--line);
        color: var(--mut);
      }
      .msg {
        padding: 12px 14px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-weight: 600;
        border-left: 5px solid;
      }
      .msg.ok {
        border-color: var(--ok);
        background: #0b8f7e1a;
      }
      .msg.no {
        border-color: var(--bad);
        background: #c93c3c1a;
      }
      .tx {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .blk {
        font:
          12px ui-monospace,
          Menlo,
          monospace;
        border-left: 3px solid var(--ok);
        padding: 4px 0 10px 10px;
        margin-left: 6px;
        position: relative;
      }
      .blk.BLOCKED {
        border-color: var(--bad);
      }
      .blk span {
        color: var(--mut);
      }
      .login {
        max-width: 520px;
        margin: 50px auto;
        padding: 0 20px;
      }
      .login button {
        display: block;
        width: 100%;
        margin: 8px 0;
        text-align: left;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">campus<i>Pay</i></div>
      <div id="who"></div>
    </header>
    <div id="app"></div>
    <script>
      let tok = sessionStorage.getItem("tok"),
        S = null,
        msg = null;
      const $ = (s) => document.querySelector(s),
        inr = (n) => "₹" + Number(n).toLocaleString("en-IN");
      const api = (m, p, b) =>
        fetch("/api" + p, {
          method: m,
          headers: {
            Authorization: "Bearer " + tok,
            "Content-Type": "application/json",
          },
          body: b ? JSON.stringify(b) : undefined,
        }).then(async (r) => {
          const j = await r.json();
          if (!r.ok) throw new Error(j.error);
          return j;
        });
      const act = async (m, p, b, after) => {
        try {
          const r = await api(m, p, b);
          if (after) after(r);
          await load();
        } catch (e) {
          msg = { ok: false, t: e.message };
          render();
        }
      };
      async function login(email) {
        try {
          const r = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password: "demo123" }),
          }).then((r) => r.json());
          tok = r.token;
          sessionStorage.setItem("tok", tok);
          msg = null;
          load();
        } catch (e) {
          alert(e.message);
        }
      }
      function logout() {
        sessionStorage.clear();
        tok = null;
        S = null;
        render();
      }
      async function load() {
        if (!tok) return render();
        try {
          S = await api("GET", "/state");
        } catch {
          return logout();
        }
        render();
      }
      const val = (id) => document.getElementById(id).value;
      function render() {
        if (!tok || !S) {
          $("#who").innerHTML = "";
          $("#app").innerHTML =
            `<div class="login"><h1>campusPay</h1><p class="mut">Programmable campus wallet. Money moves only where, and as much as, the parent's rules allow. Pick a demo account:</p>
 ${[
   ["parent@campus.in", "Parent", "sets the rules, adds funds"],
   ["student@campus.in", "Student", "pays by scanning merchant requests"],
   ["canteen@campus.in", "Canteen (merchant)", "creates payment requests"],
   [
     "pixel@campus.in",
     "PixelPlay (unapproved merchant)",
     "gaming store, should get blocked",
   ],
   ["admin@campus.in", "College admin", "approves merchants"],
 ]
   .map(
     (a) =>
       `<button onclick="login('${a[0]}')">${a[1]}<br><span class="mut" style="font-weight:400">${a[2]}</span></button>`,
   )
   .join("")}</div>`;
          return;
        }
        const r = S.me.role,
          w = S.wallet;
        $("#who").innerHTML =
          `${S.me.name} <button class="ghost" onclick="logout()">Log out</button>`;
        let h =
          "<div>" +
          (msg
            ? `<div class="msg ${msg.ok ? "ok" : "no"}">${msg.t}</div>`
            : "");
        if (w)
          h += `<div class="card"><div class="mut">Student wallet balance</div><div class="big">${inr(w.balance)}</div><div class="mut">Daily limit ${inr(w.dailyLimit)}</div>
  ${Object.entries(w.rules)
    .map(
      ([c, b]) =>
        `<div class="row" style="justify-content:space-between;margin-bottom:0"><b>${c}</b><span class="mut">${inr(w.spent[c])} of ${inr(b)}</span></div><div class="bar"><b style="width:${b ? Math.min(100, (w.spent[c] / b) * 100) : 0}%"></b></div>`,
    )
    .join("")}</div>`;
        if (r === "parent")
          h += `<div class="card"><h2>Add funds</h2><div class="row"><input id="fa" type="number" min="1" placeholder="Amount"><button onclick="act('POST','/fund',{amount:val('fa')},()=>msg={ok:true,t:'Funds added'})">Add funds</button></div></div>
  <div class="card"><h2>Spending rules</h2><div class="mut">Only the parent can change these. Students and admins get rejected.</div>
  ${Object.entries(w.rules)
    .map(
      ([c, b]) =>
        `<div class="row"><b style="width:90px">${c}</b><input id="r_${c}" type="number" value="${b}"><button class="ghost" onclick="act('PUT','/rules',{category:'${c}',budget:val('r_${c}')},()=>msg={ok:true,t:'${c} budget saved'})">Save</button></div>`,
    )
    .join("")}
  <div class="row"><b style="width:90px">Daily limit</b><input id="dl" type="number" value="${w.dailyLimit}"><button class="ghost" onclick="act('PUT','/rules',{dailyLimit:val('dl')},()=>msg={ok:true,t:'Daily limit saved'})">Save</button></div></div>`;
        if (r === "student")
          h += `<div class="card"><h2>Scan a payment request</h2>${
            S.requests.length
              ? S.requests
                  .map((q) => {
                    const m = S.merchants.find((x) => x.id === q.merchantId);
                    return `<div class="tx"><div><b>${m.name}</b> <span class="mut">${m.category} · ${q.id}</span></div><div>${inr(q.amount)} <button onclick="act('POST','/pay',{requestId:'${q.id}'},t=>msg={ok:t.status==='APPROVED',t:t.status==='APPROVED'?'Paid '+inr(t.amount)+' to '+t.merchant:'Blocked: '+t.reason})">Pay</button></div></div>`;
                  })
                  .join("")
              : '<div class="mut">No open requests. Ask a merchant to create one.</div>'
          }</div>`;
        if (r === "merchant")
          h += `<div class="card"><h2>New payment request</h2><div class="row"><input id="ma" type="number" min="1" placeholder="Amount"><button onclick="act('POST','/requests',{amount:val('ma')},q=>msg={ok:true,t:'Request '+q.id+' is ready for the student to scan'})">Create request</button></div></div>
  <div class="card"><h2>Your requests</h2>${S.requests.map((q) => `<div class="tx"><span>${q.id} · ${inr(q.amount)}</span><span class="tag ${q.status}">${q.status}</span></div>`).join("") || '<div class="mut">None yet.</div>'}</div>`;
        if (r === "admin")
          h += `<div class="card"><h2>Campus merchants</h2>${S.merchants.map((m) => `<div class="tx"><span><b>${m.name}</b> <span class="mut">${m.category}</span></span><button class="ghost" onclick="act('POST','/merchants/approve',{id:'${m.id}',approved:${!m.approved}})">${m.approved ? "Revoke" : "Approve"}</button></div>`).join("")}</div>
  <div class="card"><h2>Demo tools</h2><div class="row"><button class="ghost" onclick="act('POST','/demo/tamper',{},()=>msg={ok:false,t:'Ledger record edited. Click Verify chain.'})">Simulate tampering</button><button class="ghost" onclick="act('POST','/demo/reset',{},()=>msg={ok:true,t:'Demo data reset'})">Reset demo</button></div></div>`;
        h += `<div class="card"><h2>Transactions</h2>${S.txs.map((t) => `<div class="tx"><div>${t.merchant} <span class="mut">${t.category}${t.reason ? " · " + t.reason : ""}</span></div><div>${inr(t.amount)} <span class="tag ${t.status}">${t.status}</span></div></div>`).join("") || '<div class="mut">No transactions yet.</div>'}</div></div>`;
        h += `<div><div class="card"><h2>Ledger</h2><div class="row"><button class="ghost" onclick="chk()">Verify chain</button><span id="vr" class="mut">${S.total} blocks</span></div>
  ${S.ledger.map((b) => `<div class="blk ${b.type}"><b>#${b.i} ${b.type}</b><br><span>prev ${b.prev.slice(0, 10)}</span><br>hash ${b.hash.slice(0, 10)}</div>`).join("")}</div></div>`;
        $("#app").innerHTML = "<main>" + h + "</main>";
      }
      async function chk() {
        const v = await api("GET", "/verify");
        const e = $("#vr");
        e.style.color = v.valid ? "var(--ok)" : "var(--bad)";
        e.textContent = v.valid
          ? "Chain valid (" + v.blocks + " blocks)"
          : "Tampering detected at block #" + v.brokenAt;
      }
      load();
      setInterval(() => {
        if (tok && !document.querySelector("input:focus")) load();
      }, 4000);
    </script>
  </body>
</html>
